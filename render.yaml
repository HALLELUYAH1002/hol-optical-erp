services:
  - type: web
    name: hol-optical-erp
    env: python
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hol-optical-erp-db
          property: connectionString

databases:
  - name: hol-optical-erp-db
